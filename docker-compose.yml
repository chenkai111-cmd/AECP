services:
  mysql:
    image: mysql:8.4
    container_name: aecp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aecp}
      MYSQL_USER: ${MYSQL_USER:-aecp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aecp_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aecp_root_password}
    ports:
      - "3306:3306"
    volumes:
      - aecp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: aecp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - aecp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend-static:
    image: nginx:1.27-alpine
    container_name: aecp-frontend-static
    restart: unless-stopped
    profiles:
      - frontend
    ports:
      - "4173:80"
    volumes:
      - ./xiaou-frontend/dist:/usr/share/nginx/html:ro
      - ./xiaou-frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  aecp-mysql-data:
  aecp-redis-data:
