spring:
  datasource:
    driver-class-name: ${AECP_DB_DRIVER:com.p6spy.engine.spy.P6SpyDriver}
    url: ${AECP_DB_URL:jdbc:p6spy:mysql://localhost:3306/aecp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${AECP_DB_USERNAME:aecp}
    password: ${AECP_DB_PASSWORD:aecp_dev_password}
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: ${AECP_REDIS_ADDRESS:redis://localhost:6379}
          timeout: ${AECP_REDIS_TIMEOUT:3000}

